<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
        }

        h1 {
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 30px 0;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f2f2f2;
        }

        .logout {
            text-align: center;
            margin: 20px;
        }

        .logout a {
            background: red;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="container">

    <div class="card">
        <h2>Registered Users</h2>
        <table>
            <tr><th>ID</th><th>Email</th></tr>
            {% for user in users %}
            <tr>
                <td>{{ user['id'] }}</td>
                <td>{{ user['email'] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <div class="card">
        <h2>User Enquiries</h2>
        <table>
            <tr><th>ID</th><th>Message</th></tr>
            {% for row in enquiries %}
            <tr>
                <td>{{ row['id'] }}</td>
                <td>{{ row['message'] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

<div class="logout">
    <a href="/admin_logout">Logout</a>
</div>

</body>
</html>
